name: Azure Full Deployment

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

env:
  BACKEND_APP_NAME: indonesia-sns-backend
  FRONTEND_APP_NAME: indonesia-sns-frontend
  RESOURCE_GROUP: indonesia-sns-rg
  CONTAINER_REGISTRY: indonesiasnsacr.azurecr.io

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'backend') || contains(github.event.head_commit.message, 'Backend') || contains(github.event.head_commit.message, 'BACKEND') || github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.modified, ' '), 'backend')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Azure Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.CONTAINER_REGISTRY }}
        username: ${{ secrets.AZURE_CLIENT_ID }}
        password: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Build and push backend image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: true
        tags: |
          ${{ env.CONTAINER_REGISTRY }}/indonesia-sns-backend:${{ github.sha }}
          ${{ env.CONTAINER_REGISTRY }}/indonesia-sns-backend:latest

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy backend to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.BACKEND_APP_NAME }}
        resource-group: ${{ env.RESOURCE_GROUP }}
        images: ${{ env.CONTAINER_REGISTRY }}/indonesia-sns-backend:${{ github.sha }}

  deploy-frontend:
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'frontend') || contains(github.event.head_commit.message, 'Frontend') || contains(github.event.head_commit.message, 'FRONTEND') || github.event_name == 'workflow_dispatch' || contains(join(github.event.commits.*.modified, ' '), 'frontend')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to Azure Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.CONTAINER_REGISTRY }}
        username: ${{ secrets.AZURE_CLIENT_ID }}
        password: ${{ secrets.AZURE_CLIENT_SECRET }}

    - name: Build and push frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: true
        tags: |
          ${{ env.CONTAINER_REGISTRY }}/indonesia-sns-frontend:${{ github.sha }}
          ${{ env.CONTAINER_REGISTRY }}/indonesia-sns-frontend:latest

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy frontend to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.FRONTEND_APP_NAME }}
        resource-group: ${{ env.RESOURCE_GROUP }}
        images: ${{ env.CONTAINER_REGISTRY }}/indonesia-sns-frontend:${{ github.sha }}

